name: Demo deploy

on:
  push:
    branches: [ "demo" ]
  workflow_dispatch:
jobs:
  docker-build-and-push-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: vars
        run: echo "VERSION=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
      - name: Build Client Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/checkmate:frontend-demo \
            -f ./docker/prod/client.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/bluewave-labs/checkmate \
            --build-arg VITE_APP_VERSION=${{ env.VERSION }} \
            .

      - name: Push Client Docker image
            permissions:
              contents: read
              packages: write
        run: docker push ghcr.io/${{ github.repository_owner }}/checkmate:frontend-demo

  docker-build-and-push-server:
    needs: docker-build-and-push-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Server Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/checkmate:backend-demo \
            -f ./docker/prod/server.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/bluewave-labs/checkmate \
            .

      - name: Push Server Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/checkmate:backend-demo

      # Removed: build/push custom MongoDB image (use upstream image instead)

  # deploy-to-demo job removed: deployment steps disabled.
  # CI will only build and push images; deployments should be performed separately.
