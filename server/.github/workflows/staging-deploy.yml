name: Staging deploy

permissions:
  contents: read
  packages: write

on:
  push:
    branches: ["develop"]

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.CR_USERNAME || github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build Server Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/checkmate-backend:staging \
            -f ./docker/staging/server.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            .

      - name: Push Server Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/checkmate-backend:staging

      # Removed: build/push custom MongoDB image (use upstream image instead)

      - name: Build Redis Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/checkmate-redis:staging \
            -f ./docker/staging/redis.Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            .

      - name: Push Redis Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/checkmate-redis:staging

  # deploy-to-staging job removed: deployment steps disabled.
  # CI will only build and push images; deployments should be performed separately.
