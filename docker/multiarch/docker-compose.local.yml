services:
  server:
    platform: linux/arm64
    image: checkmate/server:local-arm64
    restart: always
    ports:
      - "52345:52345"
    env_file:
      - ../../server/.env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:6.0
    restart: always
    command: ["mongod", "--quiet", "--bind_ip_all"]
    volumes:
      - ./mongo/data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 30s
      start_period: 0s
      retries: 30

  # client: omitted for local server testing. Run the frontend separately with Vite
  # If you want to run the client in Docker, uncomment and build `uptime_client` or
  # replace the image with a published client image.

volumes:
  mongo_data: {}
